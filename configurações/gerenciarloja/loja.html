<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Loja · Admin | Amor NeuroDivergente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-container {
            background: white; border-radius: 16px;
            max-width: 560px; width: 90%; max-height: 90vh; overflow-y: auto;
        }
        .toast-msg {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: white; padding: 12px 28px;
            border-radius: 50px; font-size: 0.85rem; z-index: 2000;
            opacity: 0; transition: all 0.3s ease; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-msg.success { background: #10b981; }
        .toast-msg.error { background: #ef4444; }
        .toast-msg.info { background: #3b82f6; }
        .loading-spinner { display: none; text-align: center; padding: 20px; color: #8b5cf6; }
        .loading-spinner.show { display: block; }
        .product-card {
            transition: all 0.2s ease; background: white;
            border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 16px; margin-bottom: 16px;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .pill-btn {
            background: white; border: 1px solid #e5e7eb;
            border-radius: 20px; padding: 6px 16px;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .pill-btn:hover { border-color: #8b5cf6; background: #f3e8ff; }
        .pill-btn.active { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .badge-cat {
            font-size: 10px; padding: 2px 8px;
            border-radius: 20px; background: #f3e8ff;
            color: #7c3aed; font-weight: 600;
        }
    </style>
</head>
<body class="p-8">

    <!-- TELA DE BLOQUEIO -->
    <div id="accessDenied" class="hidden fixed inset-0 bg-slate-900 text-white flex items-center justify-center z-50" style="display:none;">
        <div class="text-center px-6">
            <i class="fa-solid fa-shield-halved text-6xl text-red-500 mb-5"></i>
            <h1 class="text-2xl font-bold mb-2">Acesso Restrito</h1>
            <p class="text-slate-400 mb-6">Você não tem permissão para acessar esta área.</p>
            <a href="/inicio.html" class="inline-block px-8 py-3 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full font-semibold text-white hover:opacity-90 transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Voltar ao Início
            </a>
        </div>
    </div>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loadingScreen" class="fixed inset-0 bg-white flex items-center justify-center z-40">
        <div class="text-center">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-purple-500 mb-4"></i>
            <p class="text-slate-500">Verificando permissões...</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="mainContent" class="max-w-6xl mx-auto" style="display:none;">
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='/painel-admin/painel.html'" class="text-gray-500 hover:text-gray-800 transition-colors" title="Voltar ao Painel Admin">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div>
                    <div class="flex items-center gap-2 text-lg font-semibold text-gray-800">
                        <i class="fa-solid fa-brain text-purple-600"></i>
                        Admin <span class="text-gray-400 font-normal">·</span> Loja
                    </div>
                    <div class="text-sm text-gray-400 mt-0.5" id="productCount">
                        0 produto(s) cadastrado(s)
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar produtos..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm w-64 focus:outline-none focus:border-purple-500">
                </div>
                <button id="openModalBtn" class="flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:opacity-90 transition-opacity shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    Novo produto
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button class="pill-btn active" data-filter="todos">Todos</button>
            <button class="pill-btn" data-filter="amazon">Amazon</button>
            <button class="pill-btn" data-filter="shopee">Shopee</button>
            <button class="pill-btn" data-filter="mercado-livre">Mercado Livre</button>
            <button class="pill-btn" data-filter="aliexpress">AliExpress</button>
        </div>

        <!-- Grid -->
        <div id="productsGrid" class="space-y-4"></div>

        <!-- Load More -->
        <div class="text-center py-6">
            <div id="loadingSpinner" class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> Carregando mais produtos...
            </div>
            <button id="loadMoreBtn" class="hidden mt-3 px-6 py-2 bg-white border border-gray-200 rounded-lg text-sm text-gray-600 hover:border-purple-400 hover:text-purple-600 transition">
                Carregar mais
            </button>
        </div>
    </div>

    <!-- MODAL PRODUTO -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-container">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800" id="modalTitle">Novo Produto</h3>
                    <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <form id="productForm" class="space-y-4">
                    <input type="hidden" id="productId">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Produto *</label>
                        <input type="text" id="productName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                        <textarea id="productDescription" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Preço (R$) *</label>
                            <input type="number" id="productPrice" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Preço antigo (R$)</label>
                            <input type="number" id="productOldPrice" step="0.01" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Marketplace *</label>
                            <select id="productMarketplace" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 bg-white">
                                <option value="shopee">Shopee</option>
                                <option value="amazon">Amazon</option>
                                <option value="mercado-livre">Mercado Livre</option>
                                <option value="aliexpress">AliExpress</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Categoria *</label>
                            <select id="productCategory" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 bg-white">
                                <option value="vestuario">Vestuário</option>
                                <option value="foco-tdah">Foco & TDAH</option>
                                <option value="sensorial">Sensorial</option>
                                <option value="livros">Livros</option>
                                <option value="audio">Áudio</option>
                                <option value="casa">Casa</option>
                                <option value="criativo">Criativo</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fornecedor / Vendedor</label>
                        <input type="text" id="productVendor" placeholder="Ex: NeuroStore" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                        <input type="url" id="productImage" placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Link do Produto</label>
                        <input type="url" id="productLink" placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Palavras-chave (separadas por vírgula)</label>
                        <input type="text" id="productKeywords" placeholder="fidget, tdah, foco" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-medium hover:bg-purple-700 transition">Salvar</button>
                        <button type="button" id="cancelModalBtn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL VISUALIZAR -->
    <div id="viewModal" class="modal-overlay">
        <div class="modal-container">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Detalhes do Produto</h3>
                    <button id="closeViewModalBtn" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="viewModalContent"></div>
                <div class="flex gap-3 pt-4">
                    <button id="editFromViewBtn" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-medium hover:bg-purple-700 transition">Editar</button>
                    <button id="closeViewModalFooterBtn" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastMsg" class="toast-msg"></div>

    <!-- ============================================ -->
    <!-- SUPABASE                                     -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.supabaseClient = supabase.createClient(
            'https://qyixzontuhrxrrjrmzvy.supabase.co',
            'sb_publishable_cPivIaJPzZRIRzkbFlAH_g_3R1_9auE'
        );
        console.log('✅ Supabase pronto:', !!window.supabaseClient);
    </script>

    <!-- ============================================ -->
    <!-- SCRIPT DO PAINEL                              -->
    <!-- ============================================ -->
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const supabase = window.supabaseClient;
        if (!supabase) {
            alert('Supabase não inicializado. Recarregue a página.');
            return;
        }

        // ============================================
        // ESTADO
        // ============================================
        let currentUser = null;
        let isAdmin = false;
        let allProducts = [];
        let filteredProducts = [];
        let renderedCount = 0;
        const PER_PAGE = 10;
        let currentSearch = '';
        let currentFilter = 'todos';
        let viewingProduct = null;
        let editingId = null;
        let searchDebounce = null;

        // DOM
        const productsGrid   = document.getElementById('productsGrid');
        const searchInput    = document.getElementById('searchInput');
        const productCount   = document.getElementById('productCount');
        const openModalBtn   = document.getElementById('openModalBtn');
        const closeModalBtn  = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const productModal   = document.getElementById('productModal');
        const productForm    = document.getElementById('productForm');
        const viewModal      = document.getElementById('viewModal');
        const closeViewModalBtn       = document.getElementById('closeViewModalBtn');
        const closeViewModalFooterBtn = document.getElementById('closeViewModalFooterBtn');
        const editFromViewBtn         = document.getElementById('editFromViewBtn');
        const toastMsg       = document.getElementById('toastMsg');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loadMoreBtn    = document.getElementById('loadMoreBtn');
        const modalTitle     = document.getElementById('modalTitle');

        // ============================================
        // VERIFICAR AUTENTICAÇÃO + ADMIN
        // ============================================
        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();

                if (!session) {
                    denyAccess();
                    return false;
                }

                currentUser = session.user;

                const { data: profile } = await supabase
                    .from('profiles')
                    .select('is_admin, username')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                isAdmin = profile?.is_admin === true;

                if (!isAdmin) {
                    denyAccess();
                    return false;
                }

                console.log('🛡️ Admin autenticado:', profile?.username || currentUser.email);
                return true;
            } catch (e) {
                console.error('Erro auth:', e);
                denyAccess();
                return false;
            }
        }

        function denyAccess() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('accessDenied').style.display = 'flex';
        }

        function allowAccess() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'info') {
            toastMsg.textContent = message;
            toastMsg.className = `toast-msg ${type} show`;
            setTimeout(() => toastMsg.classList.remove('show'), 3000);
        }

        // ============================================
        // HELPERS
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatPrice(v) {
            if (v === null || v === undefined) return 'R$ 0,00';
            return 'R$ ' + Number(v).toFixed(2).replace('.', ',');
        }

        const mpNames = {
            'aliexpress': 'AliExpress',
            'shopee': 'Shopee',
            'mercado-livre': 'Mercado Livre',
            'amazon': 'Amazon'
        };

        // ============================================
        // CARREGAR PRODUTOS
        // ============================================
        async function loadProducts() {
            try {
                const { data, error } = await supabase.rpc('admin_get_products', {
                    p_search: currentSearch || null,
                    p_marketplace: currentFilter === 'todos' ? null : currentFilter,
                    p_limit: 500,
                    p_offset: 0
                });

                if (error) throw error;

                allProducts = data || [];
                applyFilters();
                console.log(`📦 ${allProducts.length} produtos carregados`);
            } catch (e) {
                console.error('❌ Erro ao carregar:', e);
                showToast('Erro ao carregar produtos', 'error');
            }
        }

        function applyFilters() {
            filteredProducts = allProducts;
            renderedCount = 0;
            renderProducts();
        }

        function renderProducts() {
            if (!productsGrid) return;

            if (filteredProducts.length === 0) {
                productsGrid.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-xl border border-gray-200">
                        <i class="fas fa-box-open text-5xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">Nenhum produto encontrado</p>
                        <p class="text-sm text-gray-400 mt-1">Clique em "Novo produto" para adicionar</p>
                    </div>
                `;
                productCount.textContent = '0 produto(s) cadastrado(s)';
                loadMoreBtn?.classList.add('hidden');
                return;
            }

            // Filtra do zero
            productsGrid.innerHTML = '';

            const batch = filteredProducts.slice(0, PER_PAGE);
            batch.forEach(p => productsGrid.appendChild(createCard(p)));
            renderedCount = PER_PAGE;

            productCount.textContent = `${filteredProducts.length} produto(s) cadastrado(s)`;

            // Mostra/oculta botão carregar mais
            if (renderedCount < filteredProducts.length) {
                loadMoreBtn?.classList.remove('hidden');
            } else {
                loadMoreBtn?.classList.add('hidden');
            }
        }

        function loadMore() {
            const next = filteredProducts.slice(renderedCount, renderedCount + PER_PAGE);
            next.forEach(p => productsGrid.appendChild(createCard(p)));
            renderedCount += PER_PAGE;

            if (renderedCount >= filteredProducts.length) {
                loadMoreBtn?.classList.add('hidden');
            }
        }

        function createCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.id = product.id;

            const img = product.image || 'https://via.placeholder.com/64?text=Produto';
            const desc = product.description
                ? escapeHtml(product.description.substring(0, 80)) + (product.description.length > 80 ? '...' : '')
                : '';

            card.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between">
                    <div class="flex items-center gap-4 flex-1">
                        <div class="w-16 h-16 rounded-lg border border-gray-200 overflow-hidden flex-shrink-0 bg-gray-50 flex items-center justify-center">
                            <img src="${img}" alt="${escapeHtml(product.title)}" class="w-full h-full object-cover"
                                 onerror="this.src='https://via.placeholder.com/64?text=Sem+Imagem'">
                        </div>
                        <div class="flex flex-col flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <h3 class="text-[15px] font-medium text-gray-800">${escapeHtml(product.title)}</h3>
                                <span class="badge-cat">${escapeHtml(product.category || 'outros')}</span>
                                <span class="px-2 py-0.5 border border-gray-200 rounded-full text-[10px] text-gray-500 font-medium whitespace-nowrap">
                                    ${mpNames[product.marketplace] || product.marketplace}
                                </span>
                            </div>
                            ${desc ? `<p class="text-xs text-gray-400 mb-1">${desc}</p>` : ''}
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-purple-600">${formatPrice(product.price)}</span>
                                ${product.old_price ? `<span class="text-xs text-gray-400 line-through">${formatPrice(product.old_price)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-gray-500 flex-shrink-0 mt-4 sm:mt-0 ml-0 sm:ml-4">
                        ${product.link ? `
                            <a href="${product.link}" target="_blank" class="hover:text-gray-800 transition-colors" title="Abrir link">
                                <i class="fas fa-external-link-alt"></i>
                            </a>
                        ` : ''}
                        <button class="btn-view hover:text-gray-800 transition-colors" title="Visualizar">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn-edit hover:text-gray-800 transition-colors" title="Editar">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button class="btn-delete text-red-400 hover:text-red-600 transition-colors" title="Excluir">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `;

            card.querySelector('.btn-view').addEventListener('click', () => viewProduct(product.id));
            card.querySelector('.btn-edit').addEventListener('click', () => editProduct(product.id));
            card.querySelector('.btn-delete').addEventListener('click', () => deleteProduct(product.id));

            return card;
        }

        // ============================================
        // CRUD
        // ============================================
        async function createProduct(data) {
            const { data: result, error } = await supabase.rpc('admin_create_product', {
                p_title: data.title,
                p_vendor: data.vendor,
                p_description: data.description,
                p_price: data.price,
                p_old_price: data.old_price,
                p_marketplace: data.marketplace,
                p_category: data.category,
                p_keywords: data.keywords,
                p_image: data.image,
                p_link: data.link
            });

            if (error) throw error;
            if (!result?.success) throw new Error(result?.error || 'Erro ao criar');
            return result;
        }

        async function updateProduct(id, data) {
            const { data: result, error } = await supabase.rpc('admin_update_product', {
                p_id: id,
                p_title: data.title,
                p_vendor: data.vendor,
                p_description: data.description,
                p_price: data.price,
                p_old_price: data.old_price,
                p_marketplace: data.marketplace,
                p_category: data.category,
                p_keywords: data.keywords,
                p_image: data.image,
                p_link: data.link
            });

            if (error) throw error;
            if (!result?.success) throw new Error(result?.error || 'Erro ao atualizar');
            return result;
        }

        async function deleteProduct(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;

            try {
                const { data: result, error } = await supabase.rpc('admin_delete_product', { p_id: id });
                if (error) throw error;
                if (!result?.success) throw new Error(result?.error || 'Erro ao excluir');

                showToast('🗑️ Produto excluído!', 'success');
                await loadProducts();
            } catch (e) {
                console.error(e);
                showToast('Erro ao excluir: ' + e.message, 'error');
            }
        }

        // ============================================
        // MODAL
        // ============================================
        function openModal(product = null) {
            editingId = product?.id || null;
            modalTitle.textContent = product ? 'Editar Produto' : 'Novo Produto';
            productForm.reset();

            if (product) {
                document.getElementById('productId').value       = product.id;
                document.getElementById('productName').value     = product.title || '';
                document.getElementById('productDescription').value = product.description || '';
                document.getElementById('productPrice').value    = product.price || '';
                document.getElementById('productOldPrice').value = product.old_price || '';
                document.getElementById('productMarketplace').value = product.marketplace || 'shopee';
                document.getElementById('productCategory').value = product.category || 'outros';
                document.getElementById('productVendor').value   = product.vendor || '';
                document.getElementById('productImage').value    = product.image || '';
                document.getElementById('productLink').value     = product.link || '';
                document.getElementById('productKeywords').value = (product.keywords || []).join(', ');
            }

            productModal.classList.add('active');
        }

        function closeModal() {
            productModal.classList.remove('active');
            editingId = null;
            productForm.reset();
        }

        function closeViewModal() {
            viewModal.classList.remove('active');
            viewingProduct = null;
        }

        // ============================================
        // VIEW PRODUCT
        // ============================================
        function viewProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;
            viewingProduct = product;

            const content = document.getElementById('viewModalContent');
            content.innerHTML = `
                <div class="flex flex-col items-center text-center">
                    <img src="${product.image || 'https://via.placeholder.com/150?text=Produto'}"
                         class="w-32 h-32 rounded-lg object-cover mb-4"
                         onerror="this.src='https://via.placeholder.com/150?text=Sem+Imagem'">
                    <h4 class="font-semibold text-gray-800 mb-2">${escapeHtml(product.title)}</h4>
                    ${product.description ? `<p class="text-sm text-gray-600 mb-3">${escapeHtml(product.description)}</p>` : ''}
                    <div class="flex items-center gap-2 mb-3">
                        <p class="text-2xl font-bold text-purple-600">${formatPrice(product.price)}</p>
                        ${product.old_price ? `<p class="text-sm text-gray-400 line-through">${formatPrice(product.old_price)}</p>` : ''}
                    </div>
                    <div class="flex gap-2 flex-wrap justify-center mb-2">
                        <span class="badge-cat">${escapeHtml(product.category)}</span>
                        <span class="px-2 py-0.5 border border-gray-200 rounded-full text-[10px] text-gray-500">${mpNames[product.marketplace]}</span>
                    </div>
                    ${product.vendor ? `<p class="text-sm text-gray-500"><i class="fas fa-store"></i> ${escapeHtml(product.vendor)}</p>` : ''}
                    ${product.link ? `<a href="${product.link}" target="_blank" class="text-sm text-purple-600 hover:underline mt-2 inline-block"><i class="fas fa-external-link-alt"></i> Ver na loja</a>` : ''}
                </div>
            `;
            viewModal.classList.add('active');
        }

        // ============================================
        // EVENTOS
        // ============================================
        openModalBtn?.addEventListener('click', () => openModal());
        closeModalBtn?.addEventListener('click', closeModal);
        cancelModalBtn?.addEventListener('click', closeModal);
        closeViewModalBtn?.addEventListener('click', closeViewModal);
        closeViewModalFooterBtn?.addEventListener('click', closeViewModal);

        editFromViewBtn?.addEventListener('click', () => {
            if (viewingProduct) {
                const p = viewingProduct;
                closeViewModal();
                openModal(p);
            }
        });

        window.addEventListener('click', (e) => {
            if (e.target === productModal) closeModal();
            if (e.target === viewModal) closeViewModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeViewModal();
            }
        });

        // SUBMIT FORM
        productForm?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Salvando...';

            const keywordsRaw = document.getElementById('productKeywords').value.trim();
            const keywords = keywordsRaw
                ? keywordsRaw.split(',').map(k => k.trim()).filter(Boolean)
                : [];

            const data = {
                title:       document.getElementById('productName').value.trim(),
                description: document.getElementById('productDescription').value.trim(),
                price:       parseFloat(document.getElementById('productPrice').value) || 0,
                old_price:   parseFloat(document.getElementById('productOldPrice').value) || null,
                marketplace: document.getElementById('productMarketplace').value,
                category:    document.getElementById('productCategory').value,
                vendor:      document.getElementById('productVendor').value.trim() || 'Loja ND',
                image:       document.getElementById('productImage').value.trim() || null,
                link:        document.getElementById('productLink').value.trim() || null,
                keywords:    keywords
            };

            try {
                if (editingId) {
                    await updateProduct(editingId, data);
                    showToast('✅ Produto atualizado!', 'success');
                } else {
                    await createProduct(data);
                    showToast('✅ Produto criado!', 'success');
                }
                closeModal();
                await loadProducts();
            } catch (err) {
                console.error(err);
                showToast('Erro: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Salvar';
            }
        });

        // BUSCA
        searchInput?.addEventListener('input', function() {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                currentSearch = this.value.trim();
                loadProducts();
            }, 400);
        });

        // FILTROS
        document.querySelectorAll('.pill-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                loadProducts();
            });
        });

        // LOAD MORE
        loadMoreBtn?.addEventListener('click', loadMore);

        // ============================================
        // REALTIME
        // ============================================
        function subscribeRealtime() {
            supabase
                .channel('admin-products-changes')
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'products'
                }, (payload) => {
                    console.log('🔄 Mudança em produtos:', payload.eventType);
                    loadProducts();
                })
                .subscribe();
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        const authorized = await checkAuth();
        if (authorized) {
            allowAccess();
            await loadProducts();
            subscribeRealtime();
            console.log('🚀 Painel Admin da Loja pronto!');
        }
    });
    </script>
</body>
</html>
