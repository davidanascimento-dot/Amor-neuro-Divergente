    <!-- Tailwind (escopo visual do modal de leitura) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              brand: {
                orange: '#FF6719',
                // Dark mode (base)
                bg: '#121212',
                card: '#191919',
                button: '#282828',
                hover: '#333333',
                border: '#262626',
                text: '#E0E0E0',
                textMuted: '#888888',
                // Light mode (light:* variants)
                lightBg: '#FFFFFF',
                lightCard: '#F7F7F7',
                lightButton: '#EEEEEE',
                lightHover: '#E0E0E0',
                lightBorder: '#DDDDDD',
                lightText: '#1A1A1A',
                lightTextMuted: '#666666'
              }
            },
            fontFamily: {
              serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  '--tw-prose-body': theme('colors.brand.lightText'),
                  '--tw-prose-headings': theme('colors.brand.lightText'),
                  '--tw-prose-lead': theme('colors.brand.lightTextMuted'),
                  '--tw-prose-links': theme('colors.brand.orange'),
                  '--tw-prose-bold': theme('colors.brand.lightText'),
                  '--tw-prose-counters': theme('colors.brand.lightTextMuted'),
                  '--tw-prose-bullets': theme('colors.brand.lightTextMuted'),
                  '--tw-prose-hr': theme('colors.brand.lightBorder'),
                  '--tw-prose-quotes': theme('colors.brand.lightText'),
                  '--tw-prose-quote-borders': theme('colors.brand.orange'),
                  '--tw-prose-captions': theme('colors.brand.lightTextMuted'),
                  '--tw-prose-code': theme('colors.brand.lightText'),
                  '--tw-prose-pre-code': theme('colors.brand.lightText'),
                  '--tw-prose-pre-bg': theme('colors.brand.lightButton'),
                  '--tw-prose-th-borders': theme('colors.brand.lightBorder'),
                  '--tw-prose-td-borders': theme('colors.brand.lightBorder'),
                }
              },
              invert: {
                css: {
                  '--tw-prose-body': theme('colors.brand.text'),
                  '--tw-prose-headings': theme('colors.brand.text'),
                  '--tw-prose-lead': theme('colors.brand.textMuted'),
                  '--tw-prose-links': theme('colors.brand.orange'),
                  '--tw-prose-bold': theme('colors.brand.text'),
                  '--tw-prose-counters': theme('colors.brand.textMuted'),
                  '--tw-prose-bullets': theme('colors.brand.textMuted'),
                  '--tw-prose-hr': theme('colors.brand.border'),
                  '--tw-prose-quotes': theme('colors.brand.text'),
                  '--tw-prose-quote-borders': theme('colors.brand.orange'),
                  '--tw-prose-captions': theme('colors.brand.textMuted'),
                  '--tw-prose-code': theme('colors.brand.text'),
                  '--tw-prose-pre-code': theme('colors.brand.text'),
                  '--tw-prose-pre-bg': theme('colors.brand.button'),
                  '--tw-prose-th-borders': theme('colors.brand.border'),
                  '--tw-prose-td-borders': theme('colors.brand.border'),
                }
              }
            })
          }
        },
        plugins: [
          require('@tailwindcss/typography')
        ]
      };
      // Sync with site's theme (comunidade uses a11y-dark-mode on html & body)
      (function() {
        function syncTheme() {
          const isDark = document.body?.classList.contains('a11y-dark-mode') || 
                         document.documentElement?.classList.contains('a11y-dark-mode') ||
                         window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        }
        // Run immediately
        syncTheme();
        // Run again after DOM ready (body exists)
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', syncTheme);
        } else {
          syncTheme();
        }
        // Watch for theme changes
        const observer = new MutationObserver(syncTheme);
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
      })();
    </script>

    <!-- ÁREA DOS ARTIGOS -->
    <main class="artigos-main" id="mainContent">

        <div class="artigos-barra">
            <div class="artigos-abas" id="artigoAbas" role="group" aria-label="Filtrar artigos">
                <button type="button" class="artigos-aba is-ativo" data-aba="todos" aria-pressed="true">Todos</button>

            <div class="artigos-ordenar">

                <label class="sr-only" for="artigoOrdenacao">Ordenar artigos por</label>
                <select id="artigoOrdenacao" class="artigos-ordenar__select">
                    <option value="prioridade">Prioridade</option>
                    <option value="recentes">Mais recentes</option>
                    <option value="lidos">Mais lidos</option>
                    <option value="curtidos">Mais curtidos</option>
                    <option value="az">A-Z</option>

        </div>

        <div id="artigoEstado"></div>

        <p style="margin-top:2rem;text-align:center;">

                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao Fórum

        </p>

    <!-- SUBSTACK READER MODAL -->
    <div id="modalBackdrop" class="fixed inset-0 bg-black/85 dark:bg-black/85 backdrop-blur-md z-[100] flex items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200" hidden>
        
        <div id="modalContainer" class="bg-brand-lightCard dark:bg-brand-card text-brand-lightText dark:text-brand-text w-full max-w-5xl h-full sm:h-[94vh] sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden relative border border-brand-lightBorder dark:border-brand-border transform scale-98 transition-transform duration-200">
            
            <!-- TOP NAVIGATION BAR -->
            <header class="h-14 border-b border-brand-lightBorder dark:border-brand-border px-4 flex items-center justify-between shrink-0 bg-brand-lightCard/90 dark:bg-brand-card/90 backdrop-blur z-20">
                <!-- Left: Close Button -->

                    <button id="closeModalBtn" class="w-9 h-9 flex items-center justify-center bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightTextMuted dark:text-brand-textMuted hover:text-brand-lightText dark:hover:text-brand-text rounded-md transition-colors" title="Fechar (Esc)" aria-label="Fechar leitura">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Center: Substack Icon -->
                <div class="absolute left-1/2 transform -translate-x-1/2">
                    <div class="w-8 h-8 bg-brand-orange rounded-lg flex items-center justify-center shadow-md">
                        <svg class="w-4 h-4 text-white fill-current" viewBox="0 0 24 24">
                            <path d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0l-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/>
                        </svg>
                    </div>
                </div>

                <!-- Right: Actions -->

                    <button id="modalSubscribedBtn" class="px-3 py-1.5 bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightText dark:text-brand-text text-xs font-semibold rounded-md transition-colors border border-brand-lightBorder dark:border-brand-border">
                        Inscrito

                    <button id="modalPlayBtn" class="w-9 h-9 flex items-center justify-center bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightText dark:text-brand-text rounded-md transition-colors" title="Ouvir" aria-label="Ouvir artigo">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                    </button>
                    <button id="modalMoreBtn" class="w-9 h-9 flex items-center justify-center bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightTextMuted dark:text-brand-textMuted hover:text-brand-lightText dark:hover:text-brand-text rounded-md transition-colors" title="Mais opções" aria-label="Mais opções">
                        <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <!-- BODY AREA -->
            <div class="flex-1 flex relative overflow-hidden">
                
                <!-- LEFT FLOATING CONTROLS -->
                <aside class="absolute left-4 top-4 flex flex-col space-y-2 z-10 hidden sm:flex">
                    <button id="modalPrevBtn" class="w-8 h-8 flex items-center justify-center bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightTextMuted dark:text-brand-textMuted hover:text-brand-lightText dark:hover:text-brand-text rounded-md transition-colors border border-brand-lightBorder dark:border-brand-border" title="Anterior" aria-label="Artigo anterior">
                        <i data-lucide="chevron-up" class="w-4 h-4"></i>
                    </button>
                    <button id="modalNextBtn" class="w-8 h-8 flex items-center justify-center bg-brand-lightButton dark:bg-brand-button hover:bg-brand-lightHover dark:hover:bg-brand-hover text-brand-lightTextMuted dark:text-brand-textMuted hover:text-brand-lightText dark:hover:text-brand-text rounded-md transition-colors border border-brand-lightBorder dark:border-brand-border" title="Próximo" aria-label="Próximo artigo">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                    
                    <!-- Indicator Lines -->
                    <div class="pt-6 flex flex-col space-y-1 items-center opacity-40 hover:opacity-100 transition-opacity cursor-pointer">
                        <div class="w-3 h-[2px] border-t border-brand-lightBorder dark:border-brand-border"></div>
                        <div class="w-3 h-[2px] border-t border-brand-lightBorder dark:border-brand-border"></div>
                        <div class="w-3 h-[2px] border-t border-brand-lightBorder dark:border-brand-border"></div>
                    </div>
                </aside>

                <!-- ARTICLE CONTENT -->
                <main id="modalContent" class="flex-1 overflow-y-auto reader-scroll px-6 sm:px-16 md:px-24 py-10 flex justify-center">

                </main>
            </div>

            <!-- BOTTOM FLOATING FOOTER TOOLBAR -->
            <footer class="h-14 border-t border-brand-lightBorder dark:border-brand-border px-6 flex items-center justify-center shrink-0 bg-brand-lightCard dark:bg-brand-card z-20">
                <div class="flex items-center space-x-10 sm:space-x-16 text-brand-lightTextMuted dark:text-brand-textMuted">
                    
                    <!-- Like Button -->

                        <span id="modalLikeCount" class="text-sm font-sans font-medium">0</span>

                    <!-- Comment Button -->
                    <button id="modalCommentBtn" class="flex items-center space-x-2 hover:text-brand-lightText dark:hover:text-brand-text transition-colors group" title="Comentar" aria-label="Comentar">

                        <span id="modalCommentCount" class="text-sm font-sans font-medium">0</span>
                    </button>

                    <!-- Restack / Repost Button -->
                    <button id="modalRestackBtn" class="flex items-center space-x-2 hover:text-brand-lightText dark:hover:text-brand-text transition-colors group" aria-label="Restack">
                        <i data-lucide="repeat" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        <span id="modalRestackCount" class="text-sm font-sans font-medium">0</span>
                    </button>

                    <!-- Share Button -->
                    <button id="modalShareBtn" class="flex items-center space-x-2 hover:text-brand-lightText dark:hover:text-brand-text transition-colors group" title="Compartilhar" aria-label="Compartilhar">
                        <i data-lucide="share" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                    </button>

                </div>
            </footer>

        </div>
