<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artigos escritos pela comunidade do Amor NeuroDivergente — relatos, histórias, guias e análises.">
    <title>Artigos da Comunidade — Amor NeuroDivergente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/inicio.css">
    <link rel="stylesheet" href="comunidade.css">
    <link rel="stylesheet" href="/comunidade/comunidade-tokens.css">
    <link rel="stylesheet" href="/comunidade/comunidade-nav.css">
    <link rel="stylesheet" href="/comunidade/artigos.css">
    <script src="/comunidade/theme.js"></script>
    <link rel="stylesheet" href="/movimento-reduzido.css">
    <script src="/imagens.js"></script>
</head>
<body class="community-app" data-img-fundo="fundo-comunidade">

    <!-- ============================================
         HEADER SUPERIOR
         ============================================ -->
    <header class="header-glass" id="headerGlass">
        <a href="/inicio.html" class="logo">
            <img src="/img/logo-LHN9gCw1.png" alt="Amor NeuroDivergente" class="logo-img">
            <span class="logo-text">Amor NeuroDivergente</span>
        </a>

        <a href="/comunidade/comunidade.html" class="btn-voltar-site" title="Voltar para a comunidade" aria-label="Voltar para a comunidade">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar</span>
        </a>

        <a class="header-profile-btn" id="headerProfileBtn" href="/comunidade/perfil.html" aria-label="Abrir meu perfil">
            <img src="/img/foto-padrão.jpg" alt="Meu perfil" class="header-avatar" id="headerAvatar">
        </a>

        <button class="header-theme-toggle" type="button" data-a11y="darkMode" aria-pressed="false" aria-label="Ativar modo escuro" title="Ativar modo escuro">
            <i class="fa-regular fa-moon"></i>
        </button>
    </header>

    <!-- ============================================
         NAV SECUNDÁRIA
         ============================================ -->
    <nav class="community-subnav" id="communitySubnav" aria-label="Seções da comunidade">
        <div class="community-subnav-inner">
            <a class="subnav-tab" data-tab="forum" href="/comunidade/comunidade.html#screen-forum"><i class="fa-regular fa-message"></i><span>Fórum</span></a>

            <a class="subnav-tab active" data-tab="artigos" href="/comunidade/artigos.html" aria-current="page"><i class="fa-solid fa-feather-pointed"></i><span>Artigos</span></a>

            <a class="subnav-tab" data-tab="grupos" href="/comunidade/explorar-grupos.html">
                <i class="fa-solid fa-users"></i><span>Grupos</span>
            </a>

            <a class="subnav-tab" data-tab="eventos" href="/comunidade/comunidade.html#screen-eventos"><i class="fa-regular fa-calendar"></i><span>Eventos</span></a>

            <a class="subnav-tab" data-tab="conversa" href="/comunidade/conversas.html">
                <i class="fa-regular fa-comment-dots"></i><span>Conversa</span>
                <span class="subnav-dot">●</span>
            </a>
        </div>
    </nav>

    <!-- ============================================
         ÁREA DOS ARTIGOS
         ============================================ -->
    <main class="artigos-main" id="mainContent">





        <!-- ============================================
             ABAS + ORDENAÇÃO — a barra do mockup:
             Todos | Ouça | Pago | Favorito | História,
             com a ordenação (Prioridade primeiro) do
             outro lado. Clicar só filtra a lista que já
             está na página; não consulta o banco.
             ============================================ -->
        <div class="artigos-barra">
            <div class="artigos-abas" id="artigoAbas" role="group" aria-label="Filtrar artigos">
                <button type="button" class="artigos-aba is-ativo" data-aba="todos" aria-pressed="true">Todos</button>
                <button type="button" class="artigos-aba" data-aba="ouca" aria-pressed="false">Ouça</button>
                <button type="button" class="artigos-aba" data-aba="pago" aria-pressed="false">Pago</button>
                <button type="button" class="artigos-aba" data-aba="favorito" aria-pressed="false">Favorito</button>
                <button type="button" class="artigos-aba" data-aba="historia" aria-pressed="false">História</button>
            </div>

            <div class="artigos-ordenar">
                <i class="fa-solid fa-arrow-down-up-across-line" aria-hidden="true"></i>
                <label class="sr-only" for="artigoOrdenacao">Ordenar artigos por</label>
                <select id="artigoOrdenacao" class="artigos-ordenar__select">
                    <option value="prioridade">Prioridade</option>
                    <option value="recentes">Mais recentes</option>
                    <option value="lidos">Mais lidos</option>
                    <option value="curtidos">Mais curtidos</option>
                    <option value="az">A–Z</option>
                </select>
            </div>
        </div>

        <!-- ============================================
             A LISTA
             ============================================ -->

        <div id="artigoEstado"></div>

        <div class="artigos-grade" id="artigoGrade"></div>

        <p style="margin-top:2rem;text-align:center;">
            <a href="/comunidade/comunidade.html#screen-forum" class="artigo-voltar">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao Fórum
            </a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/auth-global.js"></script>
    <script src="/comunidade/comunidade-nav.js"></script>
    <script src="/comunidade/artigos-dados.js"></script>
    <script src="/comunidade/artigos.js"></script>
    <script src="/pular-conteudo.js"></script>
    <script src="/userway.js"></script>
    <script src="/vlibras.js"></script>
</body>
</html>
