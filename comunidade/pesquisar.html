<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pesquisar pessoas, grupos e artigos na comunidade do Amor NeuroDivergente.">
    <title>Pesquisar — Comunidade Amor NeuroDivergente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/inicio.css">
    <link rel="stylesheet" href="comunidade.css">
    <link rel="stylesheet" href="/comunidade/comunidade-tokens.css">
    <link rel="stylesheet" href="/comunidade/comunidade-nav.css">
    <script src="/comunidade/theme.js"></script>
    <link rel="stylesheet" href="/movimento-reduzido.css">
    <script src="/imagens.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase.js"></script>
</head>
<body class="community-app" data-img-fundo="fundo-comunidade">

    <header class="header-glass" id="headerGlass">
        <a href="/inicio.html" class="logo">
            <img src="/img/logo-LHN9gCw1.png" alt="Amor NeuroDivergente" class="logo-img">
            <span class="logo-text">Amor NeuroDivergente</span>
        </a>

        <a href="/comunidade/comunidade.html" class="btn-voltar-site" title="Voltar para a comunidade" aria-label="Voltar para a comunidade">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar</span>
        </a>

        <a class="header-profile-btn" id="headerProfileBtn" href="/comunidade/perfil.html" aria-label="Abrir meu perfil">
            <img src="/img/foto-padrão.jpg" alt="Meu perfil" class="header-avatar" id="headerAvatar">
        </a>

        <button class="header-theme-toggle" type="button" data-a11y="darkMode" aria-pressed="false" aria-label="Ativar modo escuro" title="Ativar modo escuro">
            <i class="fa-regular fa-moon"></i>
        </button>
    </header>

    <nav class="community-subnav" id="communitySubnav" aria-label="Seções da comunidade">
        <div class="community-subnav-inner">
            <a class="subnav-tab" data-tab="forum" href="/comunidade/comunidade.html#screen-forum">
                <i class="fa-regular fa-message"></i><span>Fórum</span>
            </a>

            <a class="subnav-tab" data-tab="artigos" href="/comunidade/artigos.html">
                <i class="fa-solid fa-feather-pointed"></i><span>Artigos</span>
            </a>

            <a class="subnav-tab active" data-tab="pesquisar" href="/comunidade/pesquisar.html" aria-current="page">
                <i class="fa-solid fa-magnifying-glass"></i><span>Pesquisar</span>
            </a>
        </div>
    </nav>

    <main style="max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 6rem;">
        <header style="margin-bottom: 1.25rem;">
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--cm-text); margin: 0 0 .25rem;">Pesquisar</h1>
            <p style="color: var(--cm-text-soft); font-size: .95rem; margin: 0;">Encontre pessoas, grupos e artigos na comunidade.</p>
        </header>

        <div class="user-search-bar" style="margin-bottom: 1rem;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="pesquisarInput" placeholder="Pesquisar usuário, grupo ou artigo..." autocomplete="off" style="flex:1;border:0;background:transparent;font:inherit;font-size:1rem;color:var(--cm-text);outline:none;">
        </div>

        <div id="pesquisarResultados"></div>

        <div id="pesquisarVazio" style="text-align:center; padding: 2rem 1rem; color: var(--cm-text-soft);">
            <i class="fa-regular fa-magnifying-glass" style="font-size: 2rem; margin-bottom: .5rem; display: block; color: var(--cm-muted);"></i>
            <p style="margin: 0;">Digite para pesquisar pessoas na comunidade.</p>
        </div>
    </main>

    <script>
        const sb = window.supabaseClient;

        async function apiSearchUsers(query) {
            if (!sb) return [];
            try {
                const { data, error } = await sb.rpc('search_users', { p_query: query });
                if (!error && data) return data;
            } catch (e) {}
            try {
                const { data: profiles, error: searchErr } = await sb.from('profiles')
                    .select('id, username, avatar_url')
                    .ilike('username', '%' + query + '%')
                    .limit(20);
                if (searchErr) throw searchErr;
                return profiles || [];
            } catch (e) {
                console.error('erro busca:', e);
                return [];
            }
        }

        function escapeHtml(t) { return String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        const input = document.getElementById('pesquisarInput');
        const resultados = document.getElementById('pesquisarResultados');
        const vazio = document.getElementById('pesquisarVazio');
        let timeout = null;

        if (input) {
            input.addEventListener('input', () => {
                clearTimeout(timeout);
                const q = input.value.trim();
                if (!q) {
                    resultados.innerHTML = '';
                    vazio.style.display = '';
                    vazio.querySelector('p').textContent = 'Digite para pesquisar pessoas na comunidade.';
                    return;
                }
                vazio.style.display = 'none';
                timeout = setTimeout(() => handleSearch(q), 300);
            });
        }

        async function handleSearch(query) {
            resultados.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--cm-text-soft);"><i class="fa-solid fa-spinner fa-spin"></i> Buscando...</div>';
            const users = await apiSearchUsers(query);
            if (!users.length) {
                resultados.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--cm-text-soft);">Nenhum usuário encontrado.</div>';
                return;
            }
            resultados.innerHTML = users.map(u => {
                const initial = (u.username || '?').trim().charAt(0).toUpperCase();
                const avatar = u.avatar_url
                    ? `<img src="${escapeHtml(u.avatar_url)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" onerror="this.outerHTML='<div style=\'width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cm-purple-soft);color:var(--cm-purple);font-weight:800;\'>${initial}</div>'">`
                    : `<div style="width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cm-purple-soft);color:var(--cm-purple);font-weight:800;">${initial}</div>`;
                return `<a href="/comunidade/perfil-amigo.html?id=${encodeURIComponent(u.id)}" style="display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--cm-surface);border:1px solid var(--cm-border);border-radius:var(--cm-radius);text-decoration:none;color:var(--cm-text);margin-bottom:.5rem;">
                    ${avatar}
                    <span style="flex:1;min-width:0;">
                        <strong style="display:block;font-size:.95rem;">${escapeHtml(u.username)}</strong>
                    </span>
                    <i class="fa-solid fa-chevron-right" style="color:var(--cm-muted);"></i>
                </a>`;
            }).join('');
        }
    </script>
    <script src="/comunidade/theme.js"></script>
    <script src="/imagens.js"></script>
</body>
</html>
