<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artigo da comunidade do Amor NeuroDivergente.">
    <title>Artigo — Amor NeuroDivergente</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/inicio.css">
    <link rel="stylesheet" href="comunidade.css">
    <link rel="stylesheet" href="/comunidade/comunidade-tokens.css">
    <link rel="stylesheet" href="/comunidade/comunidade-nav.css">
    <link rel="stylesheet" href="/comunidade/artigos.css">
    <script src="/comunidade/theme.js"></script>
    <link rel="stylesheet" href="/movimento-reduzido.css">
    <script src="/imagens.js"></script>
</head>
<body class="community-app" data-img-fundo="fundo-comunidade">

    <!-- ============================================
         HEADER SUPERIOR
         ============================================ -->
    <header class="header-glass" id="headerGlass">
        <a href="/inicio.html" class="logo">
            <img src="/img/logo-LHN9gCw1.png" alt="Amor NeuroDivergente" class="logo-img">
            <span class="logo-text">Amor NeuroDivergente</span>
        </a>

        <a href="/comunidade/artigos.html" class="btn-voltar-site" title="Voltar para os artigos" aria-label="Voltar para os artigos">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar</span>
        </a>

        <a class="header-profile-btn" id="headerProfileBtn" href="/comunidade/perfil.html" aria-label="Abrir meu perfil">
            <img src="/img/foto-padrão.jpg" alt="Meu perfil" class="header-avatar" id="headerAvatar">
        </a>

        <button class="header-theme-toggle" type="button" data-a11y="darkMode" aria-pressed="false" aria-label="Ativar modo escuro" title="Ativar modo escuro">
            <i class="fa-regular fa-moon"></i>
        </button>
    </header>

    <!-- ============================================
         NAV SECUNDÁRIA
         ============================================ -->
    <nav class="community-subnav" id="communitySubnav" aria-label="Seções da comunidade">
        <div class="community-subnav-inner">
            <a class="subnav-tab" data-tab="forum" href="/comunidade/comunidade.html#screen-forum"><i class="fa-regular fa-message"></i><span>Fórum</span></a>

            <a class="subnav-tab active" data-tab="artigos" href="/comunidade/artigos.html" aria-current="page"><i class="fa-solid fa-feather-pointed"></i><span>Artigos</span></a>

            <a class="subnav-tab" data-tab="grupos" href="/comunidade/explorar-grupos.html">
                <i class="fa-solid fa-users"></i><span>Grupos</span>
            </a>

            <a class="subnav-tab" data-tab="eventos" href="/comunidade/comunidade.html#screen-eventos"><i class="fa-regular fa-calendar"></i><span>Eventos</span></a>

            <a class="subnav-tab" data-tab="conversa" href="/comunidade/conversas.html">
                <i class="fa-regular fa-comment-dots"></i><span>Conversa</span>
                <span class="subnav-dot">●</span>
            </a>
        </div>
    </nav>

    <!-- ============================================
         O ARTIGO
         ============================================ -->
    <main class="artigo-main" id="mainContent">

        <div class="artigo-topo">
            <a class="artigo-voltar" href="/comunidade/artigos.html">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Todos os artigos
            </a>
            <div id="artigoTopoAcoes"></div>
        </div>

        <!-- Carregando. Ocupa o lugar do texto para a página não pular. -->
        <div class="art-carregando" id="artigoCarregando">
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <span>Carregando artigo…</span>
        </div>

        <div id="artigoEstado"></div>

        <article class="artigo-cartao" id="artigoCartao" hidden>
            <img class="artigo-capa" id="artigoCapa" alt="" hidden>

            <span class="artigo-secao" id="artigoSecao">Relatos</span>
            <h1 class="artigo-titulo" id="artigoTitulo">Carregando…</h1>
            <p class="artigo-subtitulo" id="artigoSubtitulo" hidden></p>

            <p class="artigo-aviso" id="artigoAviso" hidden>
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                <span id="artigoAvisoTexto"></span>
            </p>

            <div class="artigo-byline">
                <a class="artigo-byline__autor" id="artigoAutorLink" href="#">
                    <span class="artigo-byline__avatar" id="artigoAvatar" aria-hidden="true"></span>
                    <span>
                        <span class="artigo-byline__nome" id="artigoAutorNome">Autor</span>
                        <span class="artigo-byline__handle" id="artigoAutorHandle">@usuario</span>
                    </span>
                </a>
                <span class="artigo-byline__data" id="artigoData"></span>
                <span class="artigo-byline__data" id="artigoTempo"></span>
            </div>

            <div class="artigo-corpo" id="artigoCorpo"></div>

            <div class="artigo-acoes">
                <button type="button" class="artigo-acao" id="artigoGostarBtn">
                    <i class="fa-regular fa-heart" aria-hidden="true"></i> Curtir
                    <span class="artigo-contador" id="artigoGostarContagem">0</span>
                </button>

                <button type="button" class="artigo-acao" id="artigoFavoritoBtn" aria-pressed="false">
                    <i class="fa-regular fa-bookmark" aria-hidden="true"></i> Favorito
                </button>

                <button type="button" class="artigo-acao" id="artigoOuvirBtn">
                    <i class="fa-solid fa-volume-high" aria-hidden="true"></i> Ouça
                </button>

                <button type="button" class="artigo-acao" id="artigoCompartilharBtn">
                    <i class="fa-solid fa-share-from-square" aria-hidden="true"></i> Compartilhar
                </button>

                <span class="artigo-contador" id="artigoVisualizacoes">
                    <i class="fa-regular fa-eye" aria-hidden="true"></i> <span>0</span> leituras
                </span>
            </div>
        </article>

        <!-- ============================================
             A CONVERSA
             ============================================ -->
        <section class="artigo-conversa" id="artigoConversa" aria-labelledby="artigoConversaTitulo" hidden>
            <h2 class="artigo-conversa__titulo" id="artigoConversaTitulo">
                <i class="fa-regular fa-comments" aria-hidden="true"></i>
                Conversa <span id="artigoComentariosContagem"></span>
            </h2>

            <p class="art-login-aviso" id="artigoComentarioLogin" hidden>
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                <a href="/login/login.html?redirect=/comunidade/artigo.html" id="artigoComentarioLoginLink">Entrar</a>
                para escrever um comentário.
            </p>

            <form class="artigo-comentario-form" id="artigoComentarioForm" hidden>
                <label class="sr-only" for="artigoComentarioInput">Escrever um comentário</label>
                <textarea id="artigoComentarioInput" maxlength="2000" placeholder="O que esse texto fez com você?"></textarea>
                <button type="submit" class="btn-artigo-escrever">Publicar</button>
            </form>

            <div id="artigoComentarios"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/auth-global.js"></script>
    <script src="/comunidade/comunidade-nav.js"></script>
    <script src="/comunidade/artigos-dados.js"></script>
    <script src="/comunidade/artigo.js"></script>
    <script src="/pular-conteudo.js"></script>
    <script src="/userway.js"></script>
    <script src="/vlibras.js"></script>
</body>
</html>
